services:
  nginx:
    build: ./nginx
    container_name: ft_nginx
    ports:
      - "1443:443"
      - "1080:80"
    depends_on:
      - frontend
      - auth-service
      - user-service
    networks:
      - ft_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ft_frontend
    expose:
      - "5173"
    env_file:
      - .env
    networks:
      - ft_network
    restart: unless-stopped

  # --- Microservices backend ---
  # Chaque service : son dossier sous /services, son Dockerfile,
  # son bloc ci-dessous. Un ami qui ajoute "game-service" copie
  # ce bloc en changeant le nom, le build path et le port interne.

  auth-service:
    build: ./services/auth-service
    container_name: ft_auth_service
    expose:
      - "4000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_network
    restart: unless-stopped

  user-service:
    build: ./services/user-service
    container_name: ft_user_service
    expose:
      - "4001"
    env_file:
      - .env
    networks:
      - ft_network
    restart: unless-stopped

  prometheus:
    image: docker.io/prom/prometheus:v2.55.1
    container_name: ft_prometheus
    user: "0:0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.external-url=https://localhost/monitoring/prometheus/
      - --web.route-prefix=/monitoring/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    depends_on:
      - auth-service
      - user-service
    networks:
      - ft_network
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:11.2.2
    container_name: ft_grafana
    user: "0:0"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/monitoring/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - ft_network
    restart: unless-stopped

  # --- Base de données ---
  # Partagée entre services au démarrage pour rester simple à évaluer,
  # mais chaque service ne doit lire/écrire QUE ses propres tables
  # (couplage logique faible même si l'instance est physiquement partagée).
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: ft_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - ft_network
    restart: unless-stopped

networks:
  ft_network:
    driver: bridge

volumes:
  db_data:
  prometheus_data:
  grafana_data:
