services:
  nginx:
    build: ./nginx
    container_name: ft_nginx
    ports:
      - "1443:443"
      - "1080:80"
    depends_on:
      - frontend
      - auth-service
      - user-service
    networks:
      - ft_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ft_frontend
    expose:
      - "5173"
    env_file:
      - .env
    networks:
      - ft_network
    restart: unless-stopped

  # --- Microservices backend ---
  # Chaque service : son dossier sous /services, son Dockerfile,
  # son bloc ci-dessous. Un ami qui ajoute "game-service" copie
  # ce bloc en changeant le nom, le build path et le port interne.

  auth-service:
    build: ./services/auth-service
    container_name: ft_auth_service
    expose:
      - "4000"
    env_file:
      - .env
    environment:
      USER_SERVICE_URL: http://user-service:4001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      apply-permissions:
        condition: service_completed_successfully
    networks:
      - ft_network
    restart: unless-stopped

  user-service:
    build: ./services/user-service
    container_name: ft_user_service
    expose:
      - "4001"
    env_file:
      - .env
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      AVATAR_STORAGE_DIR: /data/avatars
    volumes:
      - avatar_data:/data/avatars
    depends_on:
      apply-permissions:
        condition: service_completed_successfully
    networks:
      - ft_network
    restart: unless-stopped

  catalog-service:
    build: ./services/catalog-service
    container_name: ft_catalog_service
    expose:
      - "4002"
    env_file:
      - .env
    depends_on:
      apply-permissions:
        condition: service_completed_successfully
    networks:
      - ft_network
    restart: unless-stopped

  media-service:
    build: ./services/media-service
    container_name: ft_media_service
    expose:
      - "4003"
    env_file:
      - .env
    environment:
      MEDIA_STORAGE_DIR: /data/audio
      CATALOG_SERVICE_URL: http://catalog-service:4002
    volumes:
      - media_data:/data/audio
    depends_on:
      apply-permissions:
        condition: service_completed_successfully
    networks:
      - ft_network
    restart: unless-stopped

  library-service:
    build: ./services/library-service
    container_name: ft_library_service
    expose:
      - "4004"
    env_file:
      - .env
    environment:
      JWT_SECRET: ${JWT_SECRET}
      CATALOG_SERVICE_URL: http://catalog-service:4002
    depends_on:
      apply-permissions:
        condition: service_completed_successfully
    networks:
      - ft_network
    restart: unless-stopped

  playback-service:
    build: ./services/playback-service
    container_name: ft_playback_service
    expose:
      - "4005"
    env_file:
      - .env
    environment:
      JWT_SECRET: ${JWT_SECRET}
      CATALOG_SERVICE_URL: http://catalog-service:4002
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4005/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      apply-permissions:
        condition: service_completed_successfully
    networks:
      - ft_network
    restart: unless-stopped

  prometheus:
    image: docker.io/prom/prometheus:v2.55.1
    container_name: ft_prometheus
    user: "0:0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.external-url=https://localhost/monitoring/prometheus/
      - --web.route-prefix=/monitoring/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    depends_on:
      - auth-service
      - user-service
    networks:
      - ft_network
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:11.2.2
    container_name: ft_grafana
    user: "0:0"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/monitoring/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - ft_network
    restart: unless-stopped

  # --- Base de données ---
  # Partagée entre services au démarrage pour rester simple à évaluer,
  # mais chaque service ne doit lire/écrire QUE ses propres tables
  # (couplage logique faible même si l'instance est physiquement partagée).
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: ft_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      AUTH_MIGRATION_PASSWORD: ${AUTH_MIGRATION_PASSWORD}
      AUTH_RUNTIME_PASSWORD: ${AUTH_RUNTIME_PASSWORD}
      USERS_MIGRATION_PASSWORD: ${USERS_MIGRATION_PASSWORD}
      USERS_RUNTIME_PASSWORD: ${USERS_RUNTIME_PASSWORD}
      CATALOG_MIGRATION_PASSWORD: ${CATALOG_MIGRATION_PASSWORD}
      CATALOG_RUNTIME_PASSWORD: ${CATALOG_RUNTIME_PASSWORD}
      MEDIA_MIGRATION_PASSWORD: ${MEDIA_MIGRATION_PASSWORD}
      MEDIA_RUNTIME_PASSWORD: ${MEDIA_RUNTIME_PASSWORD}
      LIBRARY_MIGRATION_PASSWORD: ${LIBRARY_MIGRATION_PASSWORD}
      LIBRARY_RUNTIME_PASSWORD: ${LIBRARY_RUNTIME_PASSWORD}
      PLAYBACK_MIGRATION_PASSWORD: ${PLAYBACK_MIGRATION_PASSWORD}
      PLAYBACK_RUNTIME_PASSWORD: ${PLAYBACK_RUNTIME_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init/10-bootstrap-roles.sh:/docker-entrypoint-initdb.d/10-bootstrap-roles.sh:ro
      - ./database/permissions:/permissions:ro
    expose:
      - "5432"
    networks:
      - ft_network
    restart: unless-stopped

  migrate-auth:
    build:
      context: ./services/auth-service
      target: build
    env_file:
      - .env
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_network

  migrate-users:
    build:
      context: ./services/user-service
      target: build
    env_file:
      - .env
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_network

  migrate-catalog:
    build:
      context: ./services/catalog-service
      target: build
    env_file:
      - .env
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_network

  migrate-media:
    build:
      context: ./services/media-service
      target: build
    env_file:
      - .env
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_network

  migrate-library:
    build:
      context: ./services/library-service
      target: build
    env_file:
      - .env
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_network

  migrate-playback:
    build:
      context: ./services/playback-service
      target: build
    env_file:
      - .env
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_network

  apply-permissions:
    image: docker.io/library/postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
    volumes:
      - ./database/permissions:/permissions:ro
    command:
      - sh
      - -ec
      - |
        psql --set ON_ERROR_STOP=1 --file /permissions/assign-owners.sql
        psql --set ON_ERROR_STOP=1 --file /permissions/apply-grants.sql
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
      migrate-users:
        condition: service_completed_successfully
      migrate-catalog:
        condition: service_completed_successfully
      migrate-media:
        condition: service_completed_successfully
      migrate-library:
        condition: service_completed_successfully
      migrate-playback:
        condition: service_completed_successfully
    networks:
      - ft_network

networks:
  ft_network:
    driver: bridge

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  avatar_data:
  media_data:
