services:
  nginx:
    build: ./nginx
    container_name: ft_nginx
    ports:
      - "1443:443"
      - "1080:80"
    depends_on:
      - frontend
      - auth-service
      - user-service
      - status
    networks:
      - ft_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ft_frontend
    expose:
      - "5173"
    env_file:
      - .env
    networks:
      - ft_network
    restart: unless-stopped

  # --- Microservices backend ---
  # Chaque service : son dossier sous backend/services, son Dockerfile,
  # son bloc ci-dessous. Le contexte de build est backend/, car chaque image
  # embarque aussi le paquet partagé backend/packages/service-kit.
  # Ajouter un service : voir backend/docs/CONVENTIONS.md.

  auth-service:
    build:
      context: ./backend
      dockerfile: services/auth-service/Dockerfile
    container_name: ft_auth_service
    expose:
      - "4000"
    env_file:
      - .env
    environment:
      # Auth livre les demandes durables de profil à Users via cette adresse interne.
      USER_SERVICE_URL: http://user-service:4001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      # Exécuté après les six migrations : attribue les objets et applique les droits runtime avant les services HTTP.
      apply-permissions:
        condition: service_completed_successfully
    networks:
      - ft_network
    restart: unless-stopped

  user-service:
    build:
      context: ./backend
      dockerfile: services/user-service/Dockerfile
    container_name: ft_user_service
    expose:
      - "4001"
    env_file:
      - .env
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      AVATAR_STORAGE_DIR: /data/avatars
    volumes:
      - avatar_data:/data/avatars
    depends_on:
      apply-permissions:
        condition: service_completed_successfully
    networks:
      - ft_network
    restart: unless-stopped

  # Service propriétaire des métadonnées musicales et des contrôles de publication/référence.
  catalog-service:
    build:
      context: ./backend
      dockerfile: services/catalog-service/Dockerfile
    container_name: ft_catalog_service
    expose:
      - "4002"
    env_file:
      - .env
    depends_on:
      apply-permissions:
        condition: service_completed_successfully
    networks:
      - ft_network
    restart: unless-stopped

  # Service propriétaire des originaux et aperçus ; les octets sont conservés dans media_data.
  media-service:
    build:
      context: ./backend
      dockerfile: services/media-service/Dockerfile
    container_name: ft_media_service
    expose:
      - "4003"
    env_file:
      - .env
    environment:
      MEDIA_STORAGE_DIR: /data/audio
      CATALOG_SERVICE_URL: http://catalog-service:4002
    volumes:
      - media_data:/data/audio
    depends_on:
      apply-permissions:
        condition: service_completed_successfully
    networks:
      - ft_network
    restart: unless-stopped

  # Service propriétaire des playlists privées et de leurs occurrences versionnées.
  library-service:
    build:
      context: ./backend
      dockerfile: services/library-service/Dockerfile
    container_name: ft_library_service
    expose:
      - "4004"
    env_file:
      - .env
    environment:
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CATALOG_SERVICE_URL: http://catalog-service:4002
    depends_on:
      apply-permissions:
        condition: service_completed_successfully
    networks:
      - ft_network
    restart: unless-stopped

  # Service propriétaire des sessions d’écoute et des événements de progression.
  playback-service:
    build:
      context: ./backend
      dockerfile: services/playback-service/Dockerfile
    container_name: ft_playback_service
    expose:
      - "4005"
    env_file:
      - .env
    environment:
      JWT_SECRET: ${JWT_SECRET}
      CATALOG_SERVICE_URL: http://catalog-service:4002
    # Vérifie /ready de Playback pour attendre sa disponibilité HTTP et PostgreSQL.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4005/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      apply-permissions:
        condition: service_completed_successfully
    networks:
      - ft_network
    restart: unless-stopped

  # Service propriétaire des conversations et messages entre amis, et du temps réel (WebSocket).
  # Une seule instance : le registre des connexions WebSocket est gardé en mémoire.
  chat-service:
    build:
      context: ./backend
      dockerfile: services/chat-service/Dockerfile
    container_name: ft_chat_service
    expose:
      - "4006"
    env_file:
      - .env
    environment:
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      USER_SERVICE_URL: http://user-service:4001
      # Vérifie qu'un morceau partagé dans un message est publié.
      CATALOG_SERVICE_URL: http://catalog-service:4002
    depends_on:
      apply-permissions:
        condition: service_completed_successfully
    networks:
      - ft_network
    restart: unless-stopped

  prometheus:
    image: docker.io/prom/prometheus:v2.55.1
    container_name: ft_prometheus
    user: "0:0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.external-url=https://localhost/monitoring/prometheus/
      - --web.route-prefix=/monitoring/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    depends_on:
      - auth-service
      - user-service
    networks:
      - ft_network
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:11.2.2
    container_name: ft_grafana
    user: "0:0"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/monitoring/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - ft_network
    restart: unless-stopped

  status:
    image: docker.io/library/node:22-alpine
    container_name: ft_status
    command: ["node", "/app/server.js"]
    environment:
      PROMETHEUS_URL: http://prometheus:9090/monitoring/prometheus
    volumes:
      - ./monitoring/status/server.js:/app/server.js:ro
    expose:
      - "8080"
    depends_on:
      - prometheus
    networks:
      - ft_network
    restart: unless-stopped

  backup:
    image: docker.io/library/postgres:16-alpine
    container_name: ft_backup
    command: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
    volumes:
      - ./monitoring/backup-loop.sh:/backup.sh:ro
      - ./backups:/backups
      - media_data:/media_data:ro
      - avatar_data:/avatar_data:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_network
    restart: unless-stopped

  # --- Base de données ---
  # Partagée entre services au démarrage pour rester simple à évaluer,
  # mais chaque service ne doit lire/écrire QUE ses propres tables
  # (couplage logique faible même si l'instance est physiquement partagée).
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: ft_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      # Deux rôles par service : migration pour la structure, runtime pour les seules opérations métier autorisées.
      AUTH_MIGRATION_PASSWORD: ${AUTH_MIGRATION_PASSWORD}
      AUTH_RUNTIME_PASSWORD: ${AUTH_RUNTIME_PASSWORD}
      USERS_MIGRATION_PASSWORD: ${USERS_MIGRATION_PASSWORD}
      USERS_RUNTIME_PASSWORD: ${USERS_RUNTIME_PASSWORD}
      CATALOG_MIGRATION_PASSWORD: ${CATALOG_MIGRATION_PASSWORD}
      CATALOG_RUNTIME_PASSWORD: ${CATALOG_RUNTIME_PASSWORD}
      MEDIA_MIGRATION_PASSWORD: ${MEDIA_MIGRATION_PASSWORD}
      MEDIA_RUNTIME_PASSWORD: ${MEDIA_RUNTIME_PASSWORD}
      LIBRARY_MIGRATION_PASSWORD: ${LIBRARY_MIGRATION_PASSWORD}
      LIBRARY_RUNTIME_PASSWORD: ${LIBRARY_RUNTIME_PASSWORD}
      PLAYBACK_MIGRATION_PASSWORD: ${PLAYBACK_MIGRATION_PASSWORD}
      PLAYBACK_RUNTIME_PASSWORD: ${PLAYBACK_RUNTIME_PASSWORD}
      CHAT_MIGRATION_PASSWORD: ${CHAT_MIGRATION_PASSWORD}
      CHAT_RUNTIME_PASSWORD: ${CHAT_RUNTIME_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init/10-bootstrap-roles.sh:/docker-entrypoint-initdb.d/10-bootstrap-roles.sh:ro
      - ./database/permissions:/permissions:ro
    expose:
      - "5432"
    networks:
      - ft_network
    restart: unless-stopped

  # Conteneurs de migration : utilisent la cible build et l’URL de migration, avant démarrage des services HTTP.
  migrate-auth:
    build:
      context: ./backend
      dockerfile: services/auth-service/Dockerfile
      target: build
    env_file:
      - .env
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_network

  migrate-users:
    build:
      context: ./backend
      dockerfile: services/user-service/Dockerfile
      target: build
    env_file:
      - .env
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_network

  migrate-catalog:
    build:
      context: ./backend
      dockerfile: services/catalog-service/Dockerfile
      target: build
    env_file:
      - .env
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_network

  migrate-media:
    build:
      context: ./backend
      dockerfile: services/media-service/Dockerfile
      target: build
    env_file:
      - .env
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_network

  migrate-library:
    build:
      context: ./backend
      dockerfile: services/library-service/Dockerfile
      target: build
    env_file:
      - .env
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_network

  migrate-playback:
    build:
      context: ./backend
      dockerfile: services/playback-service/Dockerfile
      target: build
    env_file:
      - .env
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_network

  migrate-chat:
    build:
      context: ./backend
      dockerfile: services/chat-service/Dockerfile
      target: build
    env_file:
      - .env
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ft_network

  apply-permissions:
    image: docker.io/library/postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
    volumes:
      - ./database/permissions:/permissions:ro
    command:
      - sh
      - -ec
      - |
        psql --set ON_ERROR_STOP=1 --file /permissions/assign-owners.sql
        psql --set ON_ERROR_STOP=1 --file /permissions/apply-grants.sql
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
      migrate-users:
        condition: service_completed_successfully
      migrate-catalog:
        condition: service_completed_successfully
      migrate-media:
        condition: service_completed_successfully
      migrate-library:
        condition: service_completed_successfully
      migrate-playback:
        condition: service_completed_successfully
      migrate-chat:
        condition: service_completed_successfully
    networks:
      - ft_network

networks:
  ft_network:
    driver: bridge

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  avatar_data:
  media_data:
