services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: per_admin
      POSTGRES_PASSWORD: per_admin_test_only
      POSTGRES_DB: transcendence_per
      AUTH_MIGRATION_PASSWORD: per_auth_migration_test_only
      AUTH_RUNTIME_PASSWORD: per_auth_runtime_test_only
      USERS_MIGRATION_PASSWORD: per_users_migration_test_only
      USERS_RUNTIME_PASSWORD: per_users_runtime_test_only
      CATALOG_MIGRATION_PASSWORD: per_catalog_migration_test_only
      CATALOG_RUNTIME_PASSWORD: per_catalog_runtime_test_only
      MEDIA_MIGRATION_PASSWORD: per_media_migration_test_only
      MEDIA_RUNTIME_PASSWORD: per_media_runtime_test_only
      LIBRARY_MIGRATION_PASSWORD: per_library_migration_test_only
      LIBRARY_RUNTIME_PASSWORD: per_library_runtime_test_only
      PLAYBACK_MIGRATION_PASSWORD: per_playback_migration_test_only
      PLAYBACK_RUNTIME_PASSWORD: per_playback_runtime_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U per_admin -d transcendence_per"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - per_db_data:/var/lib/postgresql/data
      - ../../database/init/10-bootstrap-roles.sh:/docker-entrypoint-initdb.d/10-bootstrap-roles.sh:ro
      - ../../database/permissions:/permissions:ro

  migrate-auth:
    build:
      context: ../../services/auth-service
      target: build
    environment:
      AUTH_MIGRATION_DATABASE_URL: postgresql://auth_migration:per_auth_migration_test_only@db:5432/transcendence_per?schema=auth
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy

  migrate-users:
    build:
      context: ../../services/user-service
      target: build
    environment:
      USER_MIGRATION_DATABASE_URL: postgresql://users_migration:per_users_migration_test_only@db:5432/transcendence_per?schema=users
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy

  migrate-catalog:
    build:
      context: ../../services/catalog-service
      target: build
    environment:
      CATALOG_MIGRATION_DATABASE_URL: postgresql://catalog_migration:per_catalog_migration_test_only@db:5432/transcendence_per?schema=catalog
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy

  migrate-media:
    build:
      context: ../../services/media-service
      target: build
    environment:
      MEDIA_MIGRATION_DATABASE_URL: postgresql://media_migration:per_media_migration_test_only@db:5432/transcendence_per?schema=media
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy

  migrate-library:
    build:
      context: ../../services/library-service
      target: build
    environment:
      LIBRARY_MIGRATION_DATABASE_URL: postgresql://library_migration:per_library_migration_test_only@db:5432/transcendence_per?schema=library
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy

  migrate-playback:
    build:
      context: ../../services/playback-service
      target: build
    environment:
      PLAYBACK_MIGRATION_DATABASE_URL: postgresql://playback_migration:per_playback_migration_test_only@db:5432/transcendence_per?schema=playback
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  per_db_data:
