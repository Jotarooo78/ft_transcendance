events {}

http {
    # Docker can reassign addresses when services restart. Resolve names again
    # without restarting the HTTPS gateway (Nginx >= 1.27.3).
    resolver 127.0.0.11 valid=1s ipv6=off;
    upstream auth_backend {
        zone auth_backend 64k;
        server auth-service:4000 resolve;
    }
    upstream users_backend {
        zone users_backend 64k;
        server user-service:4001 resolve;
    }
    upstream frontend_backend {
        zone frontend_backend 64k;
        server frontend:5173 resolve;
    }
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        client_max_body_size 3m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /api/auth/metrics {
            return 403;
        }

        location = /api/users/metrics {
            return 403;
        }

        location /api/auth/ {
            proxy_pass http://auth_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ^~ /api/users/internal/ {
            return 404;
        }

        location /api/users/ {
            proxy_pass http://users_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /ws/ {
            proxy_pass http://auth_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            proxy_pass http://frontend_backend/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
